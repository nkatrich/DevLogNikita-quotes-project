<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/normalize.css@8.0.1/normalize.css">
    <link rel="stylesheet" href="../style/quotes.css">
    <title>Just Quotes - Цитаты</title>

<body>
    <header class="header">
        <div class="header-container">
            <a class="logo-header" href="../index.html">Just Quotes</a>
            <div class="nav-header">

                        <li class="nav-header-li"><a href="../index.html#section-about-us">О нас</a></li>

                </div>
            </div>
        </div>
    </header>
    <main class="main">

                    <li class="nav-header-li-phone"><a href="#section-about-us">О нас</a></li>
                </ul>

            <div class="display-of-quotes">

            <div class="div-footer-text">
